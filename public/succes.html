<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ColdTrend — Accès confirmé</title>
<meta name="description" content="Ton paiement est confirmé, ton accès arrive par email." />
<meta name="robots" content="noindex" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100dvh;
    background: #0A0E1A;
    color: #F5F6F8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 440px;
    text-align: center;
  }
  .check {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border-radius: 999px;
    background: rgba(0, 196, 140, 0.14);
    border: 1px solid rgba(0, 196, 140, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #00C48C;
  }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 12px; }
  p { font-size: 15px; line-height: 1.6; color: #8A8F98; margin: 0 0 8px; }
  a.btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 24px;
    border-radius: 10px;
    background: #0047FF;
    color: #fff;
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Paiement confirmé.</h1>
    <p>Ton accès arrive par email dans les prochaines minutes — un lien vers le Google Sheet en lecture seule, envoyé à l'adresse utilisée pendant le quiz.</p>
    <p>Rien reçu sous 10 minutes ? Vérifie tes spams avant de nous écrire.</p>
    <a class="btn" href="https://coldtrend.com">Retour à l'accueil</a>
  </div>
</body>
</html>
